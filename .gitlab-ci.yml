---
stages:
  - unittests
  - test
  - build
  - scanimage
  - testapi
  - release

variables:
  # UID to match k8s
  K8SUID: 17313
  BASE_IMAGE: registry.met.no/baseimg/ubuntu:26.04
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.69.3@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689

default:
  image:
    name: registry.met.no/team-punkt/gitlab-ci/images/docker-punkt:latest
    pull_policy: if-not-present

unittests:
  stage: unittests
  image: python:3.13-slim
  script:
    - apt update
    - apt install -y libeccodes-dev
    - cd edriso
    - pip install tox
    - tox --parallel
  tags:
    - teampunkt
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

trivy_docker:
  rules: # Don't run in schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  stage: scanimage
  tags:
    - teampunkt
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    - export TRIVY_CACHE_DIR=$(pwd)/.trivycache/
    - mkdir -p ${TRIVY_CACHE_DIR}
    # Scan Dockerfile
    - trivy fs --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --scanners vuln,secret,license,misconfig Dockerfile
  cache:
    paths:
      - .trivycache/

.container_scanning:
  stage: scanimage
  tags:
    - teampunkt
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    # No need to clone the repo, we exclusively work on artifacts.  See
    # https://docs.gitlab.com/ee/ci/runners/README.html#git-strategy
    GIT_STRATEGY: none
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"

  script:
    - export TRIVY_CACHE_DIR=$(pwd)/.trivycache/
    - mkdir -p ${TRIVY_CACHE_DIR}
    - trivy --version
    # Cache cleanup is needed when scanning images with same tags.
    # Does not remove the database
    - time trivy clean --scan-cache
    # Builds report and puts it in the default workdir $CI_PROJECT_DIR,
    # so `artifacts:` can take it from there
    - time trivy image --db-repository public.ecr.aws/aquasecurity/trivy-db --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db --exit-code 0 --no-progress --format template --template "@/contrib/junit.tpl" --output "$CI_PROJECT_DIR/${CI_JOB_NAME}.xml" "$RELEASE_IMAGE_NAME"
    # Prints full report
    - time trivy image --exit-code 0 --no-progress "$RELEASE_IMAGE_NAME"
    # Fails on high and critical vulnerabilities
    - time trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL --no-progress "$RELEASE_IMAGE_NAME"
  cache:
    paths:
      - .trivycache/
  # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/
  # (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  artifacts:
    when: always
    reports:
      junit: $CI_JOB_NAME.xml

test:
  stage: test
  script:
    - TMP_IMAGE_NAME="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg UID=$K8SUID --build-arg BASE_IMAGE=$BASE_IMAGE -t $TMP_IMAGE_NAME .
  tags:
    - teampunkt
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  needs: ["unittests"]

build_image:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - teampunkt
  script:
    - RELEASE_TAG="${CI_COMMIT_TAG}-${CI_PIPELINE_IID}"
    - RELEASE_IMAGE_NAME="${CI_REGISTRY_IMAGE}:${RELEASE_TAG}"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg UID=$K8SUID --build-arg BASE_IMAGE=$BASE_IMAGE --pull -t $RELEASE_IMAGE_NAME .
    - docker push $RELEASE_IMAGE_NAME
    - echo "RELEASE_IMAGE_NAME=${RELEASE_IMAGE_NAME}" >> build.env
    - echo "RELEASE_TAG=${RELEASE_TAG}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

build_container_scanning:
  extends: .container_scanning
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build_image

# Requires CI/CD variable PROJECT_ACCESS_TOKEN (scope: write_repository)
scheduled_vuln_check:
  stage: scanimage
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  tags:
    - teampunkt
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
  script:
    - |
      set -e
      apk add --no-cache git curl jq
      export TRIVY_CACHE_DIR=$(pwd)/.trivycache/
      mkdir -p ${TRIVY_CACHE_DIR}

      # Find latest release tag (strict semver only, ignore -N pipeline suffixes)
      git fetch --tags --force
      git tag -l 'v[0-9]*' --sort=-v:refname > release-tags.txt
      LAST_GIT_TAG=$(awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }' release-tags.txt)
      if [ -z "$LAST_GIT_TAG" ]; then echo "No tag found"; exit 1; fi
      echo "Latest tag: $LAST_GIT_TAG"

      # Look up the container image built from this tag via registry API
      REPO_ID=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories" \
        | jq '.[0].id')
      IMAGE_TAG=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags?per_page=100" \
        | jq -r --arg prefix "${LAST_GIT_TAG}-" \
        '[.[] | select(.name | startswith($prefix))] | sort_by(.created_at) | last | .name')
      if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "null" ]; then
        echo "No image found for $LAST_GIT_TAG"
        exit 1
      fi
      SCAN_IMAGE="${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
      echo "Scanning $SCAN_IMAGE"

      # Scan for fixable HIGH/CRITICAL vulnerabilities (exit code 10 = vulns found)
      set +e
      trivy image --ignore-unfixed --severity HIGH,CRITICAL \
        --exit-code 10 --no-progress "$SCAN_IMAGE"
      TRIVY_EXIT=$?
      set -e

      if [ "$TRIVY_EXIT" -eq 0 ]; then
        echo "No fixable HIGH/CRITICAL vulnerabilities. No rebuild needed."
        exit 0
      elif [ "$TRIVY_EXIT" -ne 10 ]; then
        echo "Trivy scan error (exit code $TRIVY_EXIT)"
        exit 1
      fi

      # Fixable vulnerabilities found - bump patch version and push tag
      echo "Fixable HIGH/CRITICAL vulnerabilities detected. Creating patch release..."
      VERSION=$(echo "$LAST_GIT_TAG" | sed 's/^v//; s/-.*//')
      MAJOR=$(echo "$VERSION" | cut -d. -f1)
      MINOR=$(echo "$VERSION" | cut -d. -f2)
      PATCH=$(echo "$VERSION" | cut -d. -f3)
      NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
      echo "Tagging $LAST_GIT_TAG -> $NEW_TAG"
      git config user.email "ci@gitlab.met.no"
      git config user.name "GitLab CI"
      git remote set-url origin "https://oauth2:${PROJECT_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git tag -f -a "$NEW_TAG" "${LAST_GIT_TAG}^{}" -m "Automatic redeploy: fixable HIGH/CRITICAL vulnerabilities detected"
      git push origin "$NEW_TAG"
      echo "NEW_TAG=${NEW_TAG}" >> vuln_check.env
  cache:
    paths:
      - .trivycache/
  after_script:
    - |
      if [ -f vuln_check.env ]; then
        source vuln_check.env
        MSG="Scheduled vulnerability scan for <gitlab project>: fixable HIGH/CRITICAL issues found. Pushed ${NEW_TAG} to trigger rebuild and deploy to dev."
        curl -s -X POST -H 'Content-Type: application/json' \
          -d "{\"text\": \"${MSG}\"}" \
          "${CI_CHAT_WEBHOOK}"
      fi

testapi:
  stage: testapi
  tags:
    - teampunkt
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VALIDATOR_IMAGE="ghcr.io/metno/sedr:0.8.0"
    - LAST_GIT_TAG=$(git describe --tags --match="v[0-9]*" --abbrev=0)
    - RELEASE_TAG="${LAST_GIT_TAG}-${CI_PIPELINE_IID}"
    - RELEASE_IMAGE_NAME="${CI_REGISTRY_IMAGE}:${RELEASE_TAG}"
    - echo "LAST_GIT_TAG=$LAST_GIT_TAG RELEASE_TAG=$RELEASE_TAG RELEASE_IMAGE_NAME=$RELEASE_IMAGE_NAME"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "Starting $RELEASE_IMAGE_NAME"
    - docker pull $RELEASE_IMAGE_NAME
    - docker run --tty=true --detach=true --network=host $RELEASE_IMAGE_NAME --bind_host 0.0.0.0
    - echo "Testing API with ghcr.io/metno/sedr"
    - docker pull $VALIDATOR_IMAGE
    - docker run --tty=true --network=host --rm $VALIDATOR_IMAGE --openapi http://localhost:5000/api --url http://localhost:5000
  dependencies:
    - build_image

tjenester/edrisobaric:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - testapi
  variables:
    UPSTREAM_CI_COMMIT_SHA: "${CI_COMMIT_SHA}"
    UPSTREAM_CI_PROJECT_PATH: "${CI_PROJECT_PATH}"
    UPSTREAM_CI_PROJECT_URL: "${CI_PROJECT_URL}"
    UPSTREAM_IMAGES: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}-${CI_PIPELINE_IID}"
  trigger: tjenester/edrisobaric
